<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Orbit — an intelligent assistant for focused work.">
  <title>Orbit</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Space+Grotesk:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/animations.css">
</head>
<body data-theme="dark">

  <!-- SVG filter for liquid-glass effect -->
  <svg style="display:none" aria-hidden="true">
    <filter id="lg-dist" x="0%" y="0%" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.008 0.008" numOctaves="2" seed="92" result="noise" />
      <feGaussianBlur in="noise" stdDeviation="2" result="blurred" />
      <feDisplacementMap in="SourceGraphic" in2="blurred" scale="70" xChannelSelector="R" yChannelSelector="G" />
    </filter>
  </svg>

  <!-- Ambient background layers -->
  <video id="bg-video" class="bg-video" autoplay muted loop playsinline aria-hidden="true">
    <source src="assets/videos/backgroundVideo.mp4" type="video/mp4">
  </video>
  <canvas id="bg-canvas" aria-hidden="true"></canvas>
  <div class="bg-vignette" aria-hidden="true"></div>

  <div class="app" id="app">

    <!-- ===== Sidebar ===== -->
    <aside class="sidebar" aria-label="Primary navigation">
      <div class="brand" aria-label="Orbit">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <ellipse cx="12" cy="12" rx="10" ry="4" transform="rotate(-25 12 12)"></ellipse>
          <circle cx="12" cy="12" r="2.4" fill="currentColor" stroke="none"></circle>
        </svg>
      </div>

      <nav class="nav" aria-label="Sections">
        <a href="#" class="nav-item is-active" data-view="home" data-tip="Home" aria-label="Home">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M3 11l9-8 9 8"></path><path d="M5 10v10h14V10"></path>
          </svg>
          <span class="nav-label">Home</span>
        </a>
        <a href="#" class="nav-item" data-view="chat" data-tip="Chat" aria-label="Chat">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M21 12a8 8 0 0 1-11.2 7.3L4 21l1.7-5.6A8 8 0 1 1 21 12z"></path>
          </svg>
          <span class="nav-label">Chat</span>
        </a>
        <a href="#" class="nav-item" data-view="memory" data-tip="Memory" aria-label="Memory">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M12 3a4 4 0 0 0-4 4v1a3 3 0 0 0-3 3v6a3 3 0 0 0 3 3h10a3 3 0 0 0 3-3v-6a3 3 0 0 0-3-3V7a4 4 0 0 0-4-4z"></path>
            <path d="M9 8h6"></path>
          </svg>
          <span class="nav-label">Memory</span>
        </a>
        <a href="#" class="nav-item" data-view="health" data-tip="Health" aria-label="Health">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M3 12h4l2-5 4 10 2-5h6"></path>
          </svg>
          <span class="nav-label">Health</span>
        </a>
        <a href="#" class="nav-item" data-view="projects" data-tip="Projects" aria-label="Projects">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <rect x="3" y="4" width="18" height="16" rx="2"></rect>
            <path d="M3 9h18"></path>
            <path d="M8 13h2M14 13h2M8 16h6"></path>
          </svg>
          <span class="nav-label">Projects</span>
        </a>
        <a href="#" class="nav-item" data-view="tasks" data-tip="Tasks" aria-label="Tasks">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <polyline points="9 11 12 14 22 4"></polyline>
            <path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"></path>
          </svg>
          <span class="nav-label">Tasks</span>
        </a>
        <a href="#" class="nav-item" data-view="settings" data-tip="Settings" aria-label="Settings">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="12" cy="12" r="3"></circle>
            <path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"></path>
          </svg>
          <span class="nav-label">Settings</span>
        </a>
      </nav>

      <div class="sidebar-footer">
        <div class="status-pill" title="System status">
          <span class="status-dot" aria-hidden="true"></span>
          <span class="status-text">Online</span>
        </div>
        <button class="avatar-btn" aria-label="Account">
          <span class="avatar">K</span>
        </button>
      </div>
    </aside>

    <!-- ===== Main ===== -->
    <main class="main">

      <header class="topbar">
        <div class="breadcrumb" id="breadcrumb">
          <span class="crumb-label">Workspace</span>
          <span class="crumb-sep" aria-hidden="true">/</span>
          <span class="crumb-current">Home</span>
        </div>
        <div class="topbar-actions">
          <button class="ghost-btn" id="new-chat-btn" type="button">
            <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
            <span>New chat</span>
          </button>
        </div>
      </header>

      <section class="content" id="content">

        <div class="hero" id="hero">
          <div class="orb-wrap" id="orb-wrap">
            <canvas id="orb-canvas" width="260" height="260" aria-hidden="true"></canvas>
            <div class="orb-meta">
              <span class="orb-status" id="orb-status">Ready</span>
            </div>
          </div>

          <div class="heading">
            <h1 id="greeting">Good evening, Kunal</h1>
            <p id="subtext" class="subtext">How can I help you focus today?</p>
          </div>

          <div class="suggestions" id="suggestions" role="list">
            <button class="suggestion" type="button" data-prompt="Help me write clean, well-structured code">
              <span class="suggestion-icon" aria-hidden="true">
                <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><polyline points="8 7 3 12 8 17"></polyline><polyline points="16 7 21 12 16 17"></polyline></svg>
              </span>
              <span class="suggestion-title">Write code</span>
              <span class="suggestion-desc">Pair-program a feature end to end</span>
            </button>
            <button class="suggestion" type="button" data-prompt="Recall what you know about me">
              <span class="suggestion-icon" aria-hidden="true">
                <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a4 4 0 0 0-4 4v1a3 3 0 0 0-3 3v6a3 3 0 0 0 3 3h10a3 3 0 0 0 3-3v-6a3 3 0 0 0-3-3V7a4 4 0 0 0-4-4z"></path></svg>
              </span>
              <span class="suggestion-title">Recall memory</span>
              <span class="suggestion-desc">Surface context from past sessions</span>
            </button>
            <button class="suggestion" type="button" data-prompt="Run a health check-in">
              <span class="suggestion-icon" aria-hidden="true">
                <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12h4l2-5 4 10 2-5h6"></path></svg>
              </span>
              <span class="suggestion-title">Health check-in</span>
              <span class="suggestion-desc">Mood, sleep, and focus signals</span>
            </button>
            <button class="suggestion" type="button" data-prompt="Show my active projects">
              <span class="suggestion-icon" aria-hidden="true">
                <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"></rect><path d="M3 9h18"></path></svg>
              </span>
              <span class="suggestion-title">Active projects</span>
              <span class="suggestion-desc">Status, blockers, and next steps</span>
            </button>
          </div>
        </div>

        <div class="chat-log" id="chat-log" aria-live="polite"></div>

        <form class="composer glass" id="chat-box" autocomplete="off">
          <span class="glass-specular" aria-hidden="true"></span>
          <button type="button" id="attach-btn" class="icon-btn" aria-label="Attach" title="Attach">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M21.4 11.05L12.25 20.2a6 6 0 0 1-8.49-8.49L13 2.5a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"></path>
            </svg>
          </button>
          <input id="chat-input" type="text" placeholder="Message Orbit…" aria-label="Message Orbit">
          <button type="button" id="mic-btn" class="icon-btn" aria-label="Voice input" title="Voice">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="3" width="6" height="12" rx="3"></rect><path d="M5 11a7 7 0 0 0 14 0"></path><path d="M12 18v3"></path></svg>
          </button>
          <button type="submit" id="send-btn" class="send-btn" aria-label="Send message" title="Send">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l14-7-7 14-2-6-5-1z"></path></svg>
          </button>
        </form>

        <p class="footer-hint">Orbit can make mistakes. Verify important information.</p>
      </section>

      <!-- Other views mount here (chat log, memory, etc.) -->
      <section class="view-host" id="view-host" hidden></section>
    </main>
  </div>

  <!-- Attach menu popover -->
  <div class="attach-menu" id="attach-menu" hidden role="menu">
    <button class="attach-item" data-action="photos" role="menuitem">
      <span class="attach-icon">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"></rect><circle cx="8.5" cy="8.5" r="1.5"></circle><path d="M21 15l-5-5L5 21"></path></svg>
      </span>
      <div>
        <div class="attach-title">Add photos & videos</div>
        <div class="attach-sub">Upload from device</div>
      </div>
    </button>
    <button class="attach-item" data-action="generate" role="menuitem">
      <span class="attach-icon">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2l2.4 7.4H22l-6.2 4.5 2.4 7.4L12 16.8 5.8 21.3l2.4-7.4L2 9.4h7.6z"></path></svg>
      </span>
      <div>
        <div class="attach-title">Create / generate</div>
        <div class="attach-sub">Generate an image from a prompt</div>
      </div>
    </button>
    <button class="attach-item" data-action="files" role="menuitem">
      <span class="attach-icon">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline></svg>
      </span>
      <div>
        <div class="attach-title">Files</div>
        <div class="attach-sub">Documents, PDFs, code</div>
      </div>
    </button>
    <button class="attach-item" data-action="camera" role="menuitem">
      <span class="attach-icon">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path><circle cx="12" cy="13" r="4"></circle></svg>
      </span>
      <div>
        <div class="attach-title">Camera</div>
        <div class="attach-sub">Capture from webcam</div>
      </div>
    </button>
  </div>

  <script src="js/store.js"></script>
  <script src="js/background.js"></script>
  <script src="js/orb.js"></script>
  <script src="js/effects.js"></script>
  <script src="js/views.js"></script>
  <script src="js/animation.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
